name: Reusable Claude Standards Review
#
# The org-wide Claude pull request check. It reviews WFU style and
# code-quality conventions only, never whether the code works, and its result
# is a pass or fail check that branch protection can require. Consumer
# repositories keep only a stub whose `on:` block subscribes to pull_request
# events and whose single job `uses:` this workflow, so the model, the turn
# limit, the rubric, the trigger rules, and the posting all live here.
#
# Claude does not post anything itself. It returns its findings as structured
# output, and the steps after it update one comment on the pull request and
# set the check result. That keeps the comment count at one per pull request
# and makes the pass or fail decision a rule in this file rather than a
# judgment in the model's transcript. See WP-8376 and WP-8511.

on:
  workflow_call:
    inputs:
      repositoryRules:
        description: >-
          Extra rules for one repository, added to the shared rubric. Use this
          for conventions only that repository has; it cannot remove a shared
          rule.
        required: false
        type: string
        default: ''
      allowedBots:
        description: >-
          Comma-separated bot logins whose pull requests should still be
          reviewed. The action refuses non-human actors by default.
        required: false
        type: string
        default: ''
    secrets:
      claudeKey:
        required: true

env:
  # The two cost controls. A run normally needs well under ten turns; the cap
  # stops a confused run from spending more. Changing the model here changes
  # it for every repository at once.
  CLAUDE_MODEL: claude-sonnet-5-5
  CLAUDE_MAX_TURNS: '20'
  OVERRIDE_LABEL: standards-override
  COMMENT_MARKER: '<!-- wfu-claude-standards-review -->'
  # The review comment carries its own state in a hidden line: the commit it
  # reviewed, the round number, and where each finding was. The next run
  # reads it back so it can check only what changed.
  STATE_PREFIX: 'wfu-claude-standards-state: '
  # From this round on, a failing comment asks the author to step back rather
  # than keep pushing fixes one finding at a time.
  ROUND_LIMIT: '3'
  # Advisory findings shown in the comment before the rest are summarized.
  ADVISORY_LIMIT: '5'

jobs:
  review:
    name: Claude Standards Review
    # Drafts never run, which is where most of version 1's spending went.
    # Dependabot pull requests receive no secrets, so they cannot be reviewed
    # and are left to the human reviewer.
    #
    # Label events always run, never skip: a skipped run counts as passing in
    # branch protection, so skipping on an unrelated label would turn a
    # failed check green. The gate step below decides what a label event does.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: claude-standards-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      checks: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_LABEL: ${{ github.event.label.name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Four outcomes. The override label, read live rather than from the
      # event payload so a re-run sees it, passes without a review, but only
      # for the commit it was added on: a push removes the label and reviews
      # the new commit, so an override never carries over to code nobody
      # looked at. The label is removed with the job's own token, which does
      # not start another run. While overridden, the last review is kept
      # folded inside the comment. When the last real review already covers
      # this exact commit (the label was removed, the pull request was
      # reopened, or two events arrived for one push), that review is put
      # back and its result reused instead of paying for a new one. A label
      # change that is not the override keeps the last result. Anything else
      # reviews.
      - name: Decide whether to review
        id: gate
        run: |
          comment="$RUNNER_TEMP/standards-comment.md"
          existing="$RUNNER_TEMP/existing-comment.md"
          saved="$RUNNER_TEMP/saved-review.md"
          folded_open='<details><summary>Last review before the override</summary>'
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.user.type == \"Bot\" and (.body | startswith(\"$COMMENT_MARKER\")))][0].body // empty" > "$existing" || : > "$existing"
          if grep -qxF "$folded_open" "$existing"; then
            sed -n "\|^$folded_open\$|,\|^</details>\$|p" "$existing" | sed '1,2d' | sed '$d' | sed '$d' > "$saved"
          elif grep -qE '^### Claude standards review: (passed|needs changes)' "$existing"; then
            sed '1d' "$existing" > "$saved"
          else
            : > "$saved"
          fi
          if gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq '.[].name' | grep -qxF "$OVERRIDE_LABEL"; then
            if [ "$EVENT_ACTION" = "synchronize" ]; then
              gh api -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/$OVERRIDE_LABEL" > /dev/null
              echo "::notice::New commits were pushed after the $OVERRIDE_LABEL label was added, so the label was removed and ${HEAD_SHA:0:7} is reviewed."
              echo "override_cleared=true" >> "$GITHUB_OUTPUT"
            else
              echo "mode=override" >> "$GITHUB_OUTPUT"
              {
                echo "$COMMENT_MARKER"
                echo "### Claude standards review: overridden"
                echo
                echo "A person added the \`$OVERRIDE_LABEL\` label, so this check passes for ${HEAD_SHA:0:7} without blocking. The label applies only to this commit: the next push removes it and gets a new review. Removing the label puts the last review back."
                if [ -s "$saved" ]; then
                  echo
                  echo "$folded_open"
                  echo
                  cat "$saved"
                  echo
                  echo "</details>"
                fi
              } > "$comment"
              exit 0
            fi
          fi
          state=$(grep -oE "${STATE_PREFIX}[A-Za-z0-9+/=]+" "$saved" | head -1 | sed "s|^$STATE_PREFIX||" | base64 -d 2>/dev/null || true)
          if [ -n "$state" ]; then
            meta=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
              --jq "[.[] | select(.user.type == \"Bot\" and (.body | startswith(\"$COMMENT_MARKER\")))][0] | [.node_id, .user.login] | @tsv" | head -1 || true)
            IFS=$'\t' read -r node_id author <<< "$meta" || true
            # shellcheck disable=SC2016
            editor=$(gh api graphql -f query='query($id: ID!) { node(id: $id) { ... on IssueComment { editor { login } } } }' -f id="$node_id" --jq '.data.node.editor.login // ""' 2>/dev/null || echo "unknown")
            if [ -n "$editor" ] && [ "$editor" != "${author%\[bot\]}" ] && [ "$editor" != "$author" ]; then
              echo "::warning::The review comment was last edited by $editor, not the bot, so its saved result is not reused."
              state=""
            fi
          fi
          if [ "$EVENT_ACTION" != "synchronize" ] && [ -s "$saved" ] && [ -n "$state" ] \
            && [ "$(printf '%s' "$state" | jq -r '.sha // empty' 2>/dev/null)" = "$HEAD_SHA" ]; then
            echo "mode=reuse" >> "$GITHUB_OUTPUT"
            echo "blocking=$(printf '%s' "$state" | jq '[.findings[]? | select(.advisory | not)] | length')" >> "$GITHUB_OUTPUT"
            echo "The last review already covers ${HEAD_SHA:0:7}; reusing its result."
            { echo "$COMMENT_MARKER"; cat "$saved"; } > "$comment"
            exit 0
          fi
          if { [ "$EVENT_ACTION" = "labeled" ] || [ "$EVENT_ACTION" = "unlabeled" ]; } && [ "$EVENT_LABEL" != "$OVERRIDE_LABEL" ]; then
            previous=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select((.name | endswith("Claude Standards Review")) and .status == "completed" and (.conclusion == "success" or .conclusion == "failure"))] | sort_by(.completed_at) | last | .conclusion // empty')
            if [ -n "$previous" ]; then
              echo "mode=mirror" >> "$GITHUB_OUTPUT"
              echo "Only a label changed; keeping the previous result ($previous) for ${HEAD_SHA:0:7}."
              if [ "$previous" = "failure" ]; then
                echo "::error::The last standards review of this commit failed. See the review comment on the pull request."
                exit 1
              fi
              exit 0
            fi
          fi
          echo "mode=review" >> "$GITHUB_OUTPUT"

      - name: Verify the Claude credential is available
        if: steps.gate.outputs.mode == 'review'
        env:
          KEY: ${{ secrets.claudeKey }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The Claude credential is empty in this repository."
            echo "The action treats a missing key as a no-op and reports success,"
            echo "so without this check a pull request would show a green review"
            echo "that never happened. Pass the organization secret"
            echo "UMC_CLAUDE_GITHUB_APP as claudeKey from the calling workflow."
            exit 1
          fi

      - name: Checkout the pull request
        if: steps.gate.outputs.mode == 'review'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # The first review reads the whole pull request. Later reviews start
      # from the state the last comment saved: they re-check each earlier
      # finding and look for new ones only in what changed since, so the
      # findings converge instead of moving to different lines each round.
      # The saved state is used only when it is safe to: the comment was last
      # written by the bot, the base branch is the same, and the saved commit
      # is still in the branch's history. Otherwise, after a force push, a
      # rebase, a new base branch, or a hand edit of the comment, the review
      # starts over from the whole pull request.
      - name: Work out what to review
        if: steps.gate.outputs.mode == 'review'
        id: scope
        run: |
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "merge_base=$merge_base" >> "$GITHUB_OUTPUT"
          meta=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.type == \"Bot\" and (.body | startswith(\"$COMMENT_MARKER\"))) | [.node_id, .user.login, ((.body | capture(\"$STATE_PREFIX(?<s>[A-Za-z0-9+/=]+)\") | .s) // \"\")] | @tsv" | head -1 || true)
          IFS=$'\t' read -r node_id author state_line <<< "$meta" || true
          if [ -n "$state_line" ]; then
            # shellcheck disable=SC2016
            editor=$(gh api graphql -f query='query($id: ID!) { node(id: $id) { ... on IssueComment { editor { login } } } }' -f id="$node_id" --jq '.data.node.editor.login // ""' 2>/dev/null || echo "unknown")
            if [ -n "$editor" ] && [ "$editor" != "${author%\[bot\]}" ] && [ "$editor" != "$author" ]; then
              echo "::warning::The review comment was last edited by $editor, not the bot, so its saved state is ignored."
              state_line=""
            fi
          fi
          state=$(printf '%s' "$state_line" | base64 -d 2>/dev/null || true)
          round=$(( $(printf '%s' "$state" | jq -r '(.round | numbers | floor | if . < 0 or . > 1000 then 0 else . end) // 0' 2>/dev/null || echo 0) + 1 ))
          since=$(printf '%s' "$state" | jq -r 'if (.sha | type) == "string" and (.sha | test("^[0-9a-f]{40}$")) then .sha else empty end' 2>/dev/null || true)
          saved_base_ref=$(printf '%s' "$state" | jq -r '.base_ref // empty' 2>/dev/null || true)
          saved_merge_base=$(printf '%s' "$state" | jq -r 'if (.merge_base | type) == "string" and (.merge_base | test("^[0-9a-f]{40}$")) then .merge_base else empty end' 2>/dev/null || true)
          if [ -n "$since" ] && { [ "$saved_base_ref" != "$BASE_REF" ] || [ -z "$saved_merge_base" ] \
            || ! git merge-base --is-ancestor "$saved_merge_base" "$merge_base" 2>/dev/null \
            || ! git merge-base --is-ancestor "$since" "$HEAD_SHA" 2>/dev/null; }; then
            since=""
          fi
          if [ -n "$since" ]; then
            printf '%s' "$state" | jq -c '[.findings[]? | {file: (.file | tostring), line: (.line | tonumber? // 0), rule: (.rule | tostring), detail: ((.detail // "") | tostring | .[:300]), advisory: (.advisory == true)}]' > "$RUNNER_TEMP/previous-findings.json" 2>/dev/null \
              || echo '[]' > "$RUNNER_TEMP/previous-findings.json"
            git diff --no-renames --name-only "$merge_base" "$since" > "$RUNNER_TEMP/reviewed-files.txt"
            git diff --no-renames --name-only "$since" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
            echo "previous=$(cat "$RUNNER_TEMP/previous-findings.json")" >> "$GITHUB_OUTPUT"
          else
            echo '[]' > "$RUNNER_TEMP/previous-findings.json"
            : > "$RUNNER_TEMP/reviewed-files.txt"
            : > "$RUNNER_TEMP/changed-files.txt"
          fi
          {
            echo "since=$since"
            echo "round=$round"
            echo "state_line=$state_line"
          } >> "$GITHUB_OUTPUT"
          echo "Round $round${since:+, reviewing changes since ${since:0:7}}."
          git diff --stat "${since:-$merge_base}" "$HEAD_SHA"

      - name: Run the Claude standards review
        if: steps.gate.outputs.mode == 'review'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.claudeKey }}
          # The job's own token, not the Claude GitHub App's. Claude reads the
          # checkout and posts nothing, so it needs no extra GitHub access, and
          # the App exchange refuses to run until the calling stub exists on
          # the default branch, which would fail every adoption pull request.
          github_token: ${{ github.token }}
          allowed_bots: ${{ inputs.allowedBots }}
          prompt: |
            You are the WFU standards check for pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            The whole pull request is `git diff ${{ steps.scope.outputs.merge_base }} ${{ github.event.pull_request.head.sha }}`.
            ${{ steps.scope.outputs.since && format('This pull request was already reviewed at {0}, and everything up to that commit has been checked. Do exactly two things. First, re-check each earlier finding listed below at its current location (lines may have moved) and return it again with status "carried" if the violation is still there, or list it under "resolved" (file, line, rule) if it was fixed, including when it was fixed by a change in a different file. Second, look for new violations only on lines that `git diff {0} {1}` changed and that are also part of the whole pull request, and return them with status "new". Do not look for new findings anywhere else, because those lines were already reviewed. Earlier findings: {2}', steps.scope.outputs.since, github.event.pull_request.head.sha, steps.scope.outputs.previous) || 'This is the first review of this pull request, so read all of it and set status to "new" for every finding.' }}

            Your only job is to check the lines this pull request adds or changes against the rules below. You are not a code reviewer. Do not comment on whether the code works, on logic, bugs, performance, security, architecture, tests, or design. Do not suggest improvements the rules do not require. Do not report anything on lines the pull request did not touch. Do not report formatting that PHPCS checks mechanically (spacing, indentation, brace placement, docblock tag presence), because a separate PHPCS job enforces it. If you are unsure whether something breaks a rule, leave it out. A short list of real violations is worth more than a long list of possible ones. When the same kind of violation appears in several separate places within what you are reviewing, such as blank lines in two different methods, report each place in this review, so the author can fix all of them in one push instead of finding them one round at a time. A single name that breaks a rule is one finding, however many times it is used: report it once, at the line where it is introduced, and mention the other lines in that finding's sentence.

            Rules (every rule blocks the merge unless it says advisory):

            R1. No blank lines inside a function or method body.
            R2. No inline comments inside a function or method body (`//`, `#`, or `/* */`). Docblocks above the function are the place for explanation. PHPCS directives such as `// phpcs:ignore` are allowed, and so are comments in procedural template files.
            R3. Prefer guard clauses and early returns. Report a function whose main body is wrapped in an `if` that could instead return early, or `if` blocks nested three or more levels deep.
            R4. No Hungarian notation in variable, parameter, or property names the pull request introduces, such as `$aItems`, `$sName`, `$oPost`, `$iCount`, `$bEnabled`, `$fRate`, or `$vValue`. WFU dropped this convention. When the surrounding file already uses Hungarian names throughout, a new name that matches the file is advisory, because renaming one name would break the file's own consistency.
            R5. Docblock summaries and descriptions are complete sentences that start with a capital letter and end with a period.
            R6. Comments, docblocks, and CHANGELOG entries use American spelling (behavior, color, license, canceled, while rather than whilst).
            R7. No new dependency on `wfu/wfu` or `wakeforestuniversity/wfu-plugin-helpers`, and no new use of their classes. Shared code belongs in the wfu-helpers mu-plugin.
            R8. JavaScript identifiers the pull request introduces use camelCase and no Hungarian prefixes.
            R9. If CHANGELOG.md changed, the new entry follows the WFU changelog standard: a version header with a date; a first bullet in plain English with no class names, method names, or file paths, closing with an "Affects ..." clause; any technical detail as sub-items under one "Technical details:" bullet; present-participle tense ("Adding", not "Added" or "Add"); sub-items indented with exactly two spaces per level, never tabs; and no `###` heading inside an entry.
            R10. If the pull request changes a version anywhere (VERSION, the plugin or theme header `Version:`, a `define` of the plugin version, package.json, or the newest CHANGELOG header), every one of them that exists in the repository agrees on the same number.
            R11. Every changed file ends with exactly one trailing newline, including VERSION.
            R12 (advisory). New template rendering uses the wfu-helpers `RenderTrait` rather than a template class. Full admin page callbacks that include a template file directly are fine.
            ${{ inputs.repositoryRules && format('{0}Repository-specific rules (these block the merge):{0}{1}', fromJSON('"\n"'), inputs.repositoryRules) || '' }}

            Use `git diff` and the file tools to read only what you need. Return your result as the structured output: one finding per violation with the file path, the line number in the new version of the file, the rule id, one sentence saying what to change, whether it is advisory, and its status ("new" or "carried"). The summary is one or two plain sentences for the pull request author. Return an empty findings list when nothing breaks a rule, and an empty resolved list on a first review.
          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --max-turns ${{ env.CLAUDE_MAX_TURNS }}
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["summary","findings","resolved"],"properties":{"summary":{"type":"string"},"resolved":{"type":"array","maxItems":40,"items":{"type":"object","additionalProperties":false,"required":["file","line","rule"],"properties":{"file":{"type":"string"},"line":{"type":"integer"},"rule":{"type":"string"}}}},"findings":{"type":"array","maxItems":40,"items":{"type":"object","additionalProperties":false,"required":["file","line","rule","detail","advisory","status"],"properties":{"file":{"type":"string"},"line":{"type":"integer"},"rule":{"type":"string"},"detail":{"type":"string"},"advisory":{"type":"boolean"},"status":{"type":"string","enum":["new","carried"]}}}}}}'

      - name: Write the review comment
        if: steps.gate.outputs.mode == 'review'
        id: verdict
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
          SINCE: ${{ steps.scope.outputs.since }}
          ROUND: ${{ steps.scope.outputs.round }}
          MERGE_BASE: ${{ steps.scope.outputs.merge_base }}
          OVERRIDE_CLEARED: ${{ steps.gate.outputs.override_cleared }}
        run: |
          if [ -z "$RESULT" ] || ! echo "$RESULT" | jq -e '.findings' > /dev/null 2>&1; then
            echo "::error::The review did not return a result. The Claude step log above has the reason, such as a workflow validation error, a missing token, the turn limit, or a credential or billing problem."
            exit 1
          fi
          findings="$RUNNER_TEMP/findings.json"
          echo "$RESULT" | jq '
            def norm: sub("^\\./"; "");
            ($previous[0] // [] | map(.file |= norm)) as $p
            | ($reviewed | split("\n") | map(select(length > 0))) as $r
            | ($changed | split("\n") | map(select(length > 0))) as $c
            | (.findings | map(.file |= norm)) as $returned
            | ((.resolved // []) | map(.file |= norm)) as $resolved
            | [$returned[] | . as $f
              | [$p[] | select(.file == $f.file and .rule == $f.rule)] as $match
              | (if ($match | length) > 0 then "open"
                 elif $since != "" and any($r[]; . == $f.file) and (any($c[]; . == $f.file) | not) then "late"
                 else "new" end) as $kind
              | {file: $f.file, line: $f.line, rule: $f.rule, detail: $f.detail, kind: $kind,
                 advisory: (if $kind != "open" then ($f.advisory or $kind == "late")
                   elif any($c[]; . == $f.file) then ($f.advisory and all($match[]; .advisory))
                   else all($match[]; .advisory) end)}]
            + (if $since == "" then [] else
                [$p[] | . as $q
                 | select(any($r[]; . == $q.file) and (any($c[]; . == $q.file) | not))
                 | select(any($returned[]; .file == $q.file and .rule == $q.rule and .line == $q.line) | not)
                 | select(any($resolved[]; .file == $q.file and .rule == $q.rule and .line == $q.line) | not)
                 | {file, line, rule, detail, kind: "open", advisory}]
              end)' \
            --slurpfile previous "$RUNNER_TEMP/previous-findings.json" \
            --rawfile reviewed "$RUNNER_TEMP/reviewed-files.txt" \
            --rawfile changed "$RUNNER_TEMP/changed-files.txt" \
            --arg since "$SINCE" > "$findings"
          blocking=$(jq '[.[] | select(.advisory | not)] | length' "$findings")
          advisory=$(jq '[.[] | select(.advisory)] | length' "$findings")
          if [ "$blocking" -gt 0 ]; then title="needs changes ($blocking to fix)"; else title="passed"; fi
          returned=$(echo "$RESULT" | jq '.findings | length')
          state=$(jq -c --arg sha "$HEAD_SHA" --arg base_ref "$BASE_REF" --arg merge_base "$MERGE_BASE" --argjson round "$ROUND" --argjson capped "$([ "$returned" -ge 40 ] && echo true || echo false)" \
            '{sha: (if $capped then null else $sha end), base_ref: $base_ref, merge_base: $merge_base, round: $round, findings: [.[] | {file, line, rule, detail: (.detail | .[:300]), advisory}]}' "$findings" | base64 -w0)
          draft="$RUNNER_TEMP/standards-comment.draft"
          {
            echo "$COMMENT_MARKER"
            echo "### Claude standards review: $title"
            echo
            echo "$RESULT" | jq -r '.summary'
            echo
            if [ "$((blocking + advisory))" -gt 0 ]; then
              echo "| | File | Rule | What to change |"
              echo "|---|---|---|---|"
              jq -r --argjson limit "$ADVISORY_LIMIT" '([.[] | select(.advisory | not)] | sort_by(.file, .line)) + ([.[] | select(.advisory)] | sort_by(.file, .line) | .[:$limit]) | .[] | "| \(if .kind == "late" then "advisory, late" elif .advisory then "advisory" elif .kind == "new" then "**new**" else "open" end) | `\(.file):\(.line)` | \(.rule) | \(.detail | gsub("\\|"; "\\|") | gsub("\n"; " ")) |"' "$findings"
              echo
              if [ "$advisory" -gt "$ADVISORY_LIMIT" ]; then
                echo "$((advisory - ADVISORY_LIMIT)) more advisory findings are not shown. None of them block the merge."
                echo
              fi
            fi
            if [ "$returned" -ge 40 ]; then
              echo "This review reached its limit of 40 findings, so there may be more. The next push gets a full review."
              echo
            fi
            if [ "$OVERRIDE_CLEARED" = "true" ]; then
              echo "The \`$OVERRIDE_LABEL\` label was removed because new commits were pushed after it was added. Add it again if a finding on this commit is wrong."
              echo
            fi
            if [ "$blocking" -gt 0 ] && [ "$ROUND" -ge "$ROUND_LIMIT" ]; then
              echo "This is review round $ROUND. If fixes keep turning up new findings, it may be worth stepping back from the approach before pushing again, or asking a person whether these rules fit this change."
              echo
            fi
            echo "<sub>Reviewed ${HEAD_SHA:0:7}, round $ROUND. This check looks only at WFU style and code-quality conventions, not at whether the code works. Later rounds check only what changed since the last review, and a late finding on code an earlier round already passed is advisory. If a finding is wrong, a person can add the \`$OVERRIDE_LABEL\` label to pass the check for this commit.</sub>"
            echo
            echo "<!-- $STATE_PREFIX$state -->"
          } > "$draft"
          mv "$draft" "$RUNNER_TEMP/standards-comment.md"
          echo "blocking=$blocking" >> "$GITHUB_OUTPUT"

      # Runs after any failure too, so a red check never sits under an old
      # "passed" comment. The comment file lives in RUNNER_TEMP, outside the
      # checkout, so a file committed in the pull request cannot stand in for it.
      - name: Post or update the review comment
        if: ${{ !cancelled() && steps.gate.outputs.mode != 'mirror' }}
        env:
          STATE_LINE: ${{ steps.scope.outputs.state_line }}
        run: |
          comment="$RUNNER_TEMP/standards-comment.md"
          if [ ! -f "$comment" ]; then
            printf '%s\n%s\n\n%s\n' "$COMMENT_MARKER" "### Claude standards review: did not complete" \
              "The review stopped before it produced a result, so this check is failing. The run log has the details: $RUN_URL" > "$comment"
            if [ -n "$STATE_LINE" ]; then
              printf '\n<!-- %s%s -->\n' "$STATE_PREFIX" "$STATE_LINE" >> "$comment"
            fi
          fi
          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.user.type == \"Bot\" and (.body | startswith(\"$COMMENT_MARKER\")))][0].id // empty" | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$comment" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$comment" > /dev/null
          fi

      - name: Set the check result
        if: steps.gate.outputs.mode == 'review' || steps.gate.outputs.mode == 'reuse'
        env:
          BLOCKING: ${{ steps.verdict.outputs.blocking || steps.gate.outputs.blocking }}
        run: |
          if [ "$BLOCKING" != "0" ]; then
            echo "::error::$BLOCKING standards finding(s) to fix. See the review comment on the pull request."
            exit 1
          fi
