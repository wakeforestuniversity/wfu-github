name: Reusable PHP Workflow
#
# Every job installs its own dependencies from the repository's composer file.
# Version 1 cached the finished vendor/ directory under a key built from
# composer.lock, which no WFU repository commits, so all of them shared one
# key, installs ran only on a cache miss, and a dependency added in a pull
# request never reached the tests. What is cached now is Composer's download
# cache, which only makes installs faster and can never stand in for one.
# Installing per job also covers packages Composer places outside vendor/,
# such as the app repository's plugins under wp-content/. See WP-8780.
#
# The cache key ends in the run ID so every run saves a fresh copy; without a
# committed lock file the composer file rarely changes, and a fixed key would
# never be saved again after its first run. Composer Setup's install keeps the
# job name branch protection already requires and warms the cache for the
# jobs after it.

on:
  workflow_call:
    inputs:
      phpVersion:
        required: true
        type: string
      composerFile:
        required: false
        type: string
        default: 'composer.json'
    secrets:
      composerAuth:
        required: true
      qltyCoverageToken:
        required: true
      securityToken:
        required: true

jobs:
  setup:
    name: Composer Setup
    runs-on: ubuntu-latest

    steps:
      - &checkout
        uses: actions/checkout@v6
      - &setup-php
        name: Use PHP ${{ inputs.phpVersion }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.phpVersion }}
          coverage: none
      - &cache-dir
        name: Locate the Composer download cache
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"
      - &cache
        name: Restore the Composer download cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-downloads-${{ inputs.phpVersion }}-${{ hashFiles(inputs.composerFile, '**/composer.lock') }}-${{ github.run_id }}
          restore-keys: |
            composer-downloads-${{ inputs.phpVersion }}-${{ hashFiles(inputs.composerFile, '**/composer.lock') }}-
            composer-downloads-${{ inputs.phpVersion }}-

      - name: Validate the composer file
        env:
          COMPOSER: ${{ inputs.composerFile }}
        run: composer validate

      - &install
        name: Install dependencies
        env:
          COMPOSER: ${{ inputs.composerFile }}
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.composerAuth }}"} }'
        run: composer install --no-interaction --no-progress --prefer-dist

  composer:
    name: Composer Validation
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-php

      - name: Validate the per-environment composer files
        run: |
          for file in composer-dev.json composer-uat.json composer-pprd.json composer-prod.json; do
            if [ -f "$file" ]; then
              COMPOSER="$file" composer validate
            fi
          done

  testing:
    name: Testing and Code Coverage (Code Climate)
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - name: Use PHP ${{ inputs.phpVersion }} with coverage
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.phpVersion }}
          coverage: xdebug
      - *cache-dir
      - *cache
      - *install

      # A repository with a phpunit.xml has a suite, so a missing PHPUnit is
      # a broken dependency list, not a reason to skip. Version 1 skipped in
      # that case and reported a green check for tests that never ran.
      - name: Run PHPUnit
        run: |
          if [ ! -f phpunit.xml ] && [ ! -f phpunit.xml.dist ]; then
            echo "No phpunit.xml in this repository; skipping PHPUnit."
            exit 0
          fi
          if [ ! -x vendor/bin/phpunit ]; then
            echo "::error::This repository has a phpunit.xml but PHPUnit did not install. Add phpunit/phpunit to require-dev."
            exit 1
          fi
          vendor/bin/phpunit --coverage-clover clover.xml

      - uses: qltysh/qlty-action/coverage@v1
        if: hashFiles('clover.xml') != ''
        with:
          token: ${{ secrets.qltyCoverageToken }}
          format: clover
          file: clover.xml

  standards:
    name: Coding Standards (PHPCS)
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-php
      - *cache-dir
      - *cache
      - *install

      # Fails on errors, reports warnings without failing. Warnings across the
      # WFU repositories are largely TODO comments and long-standing advisory
      # notices; treating them as blocking would gate unrelated work on
      # cleanup nobody scheduled. Errors are the standard the team actually
      # holds itself to, and are what phpcbf can usually fix.
      #
      # A config file without the binary still skips: app-web-aws-wp ships a
      # repository-wide phpcs.xml without requiring PHPCS.
      - name: Run PHPCS
        run: |
          if [ ! -f phpcs.xml ] && [ ! -f phpcs.xml.dist ] && [ ! -f .phpcs.xml ] && [ ! -f .phpcs.xml.dist ]; then
            echo "No phpcs.xml in this repository; skipping PHPCS."
            exit 0
          fi
          if [ ! -x vendor/bin/phpcs ]; then
            echo "::notice::This repository has a phpcs.xml but does not require PHPCS; skipping."
            exit 0
          fi
          vendor/bin/phpcs --runtime-set ignore_warnings_on_exit 1

  security:
    name: Security (Snyk)
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-php
      - *cache-dir
      - *cache
      - *install

      # Snyk reads composer.lock, which the install step above writes, so the
      # scan covers the versions this run actually resolved.
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/php@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.securityToken }}
        with:
          args: --severity-threshold=low --all-projects
