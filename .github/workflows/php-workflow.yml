name: Reusable PHP Workflow

on:
  workflow_call:
    inputs:
      phpVersion:
        required: true
        type: string
      composerFile:
        required: false
        type: string
        default: 'composer.json'
    secrets:
      composerAuth:
        required: true
      qltyCoverageToken:
        required: true
      securityToken:
        required: true

jobs:
  setup:
    name: Composer Setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: wakeforestuniversity/wfu-github/.github/actions/php-cache-restore@v1
        id: cache-composer
        with:
          php-version: ${{ inputs.phpVersion }}

      - name: Validate composer.json and composer.lock
        run: COMPOSER=${{ inputs.composerFile }} composer validate

      - name: Install Dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{secrets.composerAuth}}"} }'
        run: COMPOSER=${{ inputs.composerFile }} composer install
        if: steps.cache-composer.outputs.cache-hit != 'true'

  composer:
    name: Composer Validation
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: wakeforestuniversity/wfu-github/.github/actions/php-cache-restore@v1
        id: cache-composer
        with:
          php-version: ${{ inputs.phpVersion }}

      - name: Check file existence
        id: check_files
        uses: andstor/file-existence-action@v2
        with:
          files: "composer-dev.json, composer-uat.json, composer-pprd.json, composer-prod.json"

      - name: Validate composer-dev.json if it exists.
        if: steps.check_files.outputs.files_exists == 'true'
        run: COMPOSER=composer-dev.json composer validate

      - name: Validate composer-uat.json if it exists.
        if: steps.check_files.outputs.files_exists == 'true'
        run: COMPOSER=composer-uat.json composer validate

      - name: Validate composer-pprd.json if it exists.
        if: steps.check_files.outputs.files_exists == 'true'
        run: COMPOSER=composer-pprd.json composer validate

      - name: Validate composer-prod.json if it exists.
        if: steps.check_files.outputs.files_exists == 'true'
        run: COMPOSER=composer-prod.json composer validate

  testing:
    name: Testing and Code Coverage (Code Climate)
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: wakeforestuniversity/wfu-github/.github/actions/php-cache-restore@v1
        id: cache-composer
        with:
          php-version: ${{ inputs.phpVersion }}

      # Without this step nothing generates clover.xml and no test ever runs:
      # the job uploaded a coverage file that did not exist and reported
      # success regardless. Each consuming repository keeps its own
      # phpunit.xml, which is the only configuration that can bootstrap its
      # tests, so this defers to that file rather than imposing one. Skipping
      # cleanly where a repository has no suite keeps this safe to adopt
      # everywhere at once.
      - name: Run PHPUnit
        run: |
          if [ ! -x vendor/bin/phpunit ]; then
            echo "PHPUnit is not installed in this repository; skipping."
          elif [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; then
            vendor/bin/phpunit --coverage-clover clover.xml
          else
            echo "No phpunit.xml in this repository; skipping PHPUnit."
          fi

      - uses: qltysh/qlty-action/coverage@v1
        if: hashFiles('clover.xml') != ''
        with:
          token: ${{ secrets.qltyCoverageToken }}
          format: clover
          file: clover.xml

  standards:
    name: Coding Standards (PHPCS)
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: wakeforestuniversity/wfu-github/.github/actions/php-cache-restore@v1
        id: cache-composer
        with:
          php-version: ${{ inputs.phpVersion }}

      # Fails on errors, reports warnings without failing. Warnings across the
      # WFU repositories are largely TODO comments and long-standing advisory
      # notices; treating them as blocking would gate unrelated work on
      # cleanup nobody scheduled. Errors are the standard the team actually
      # holds itself to, and are what phpcbf can usually fix.
      #
      # Skips cleanly where a repository has no phpcs.xml, so this is safe to
      # adopt everywhere at once.
      - name: Run PHPCS
        run: |
          if [ ! -x vendor/bin/phpcs ]; then
            echo "PHPCS is not installed in this repository; skipping."
          elif [ -f phpcs.xml ] || [ -f phpcs.xml.dist ] || [ -f .phpcs.xml ] || [ -f .phpcs.xml.dist ]; then
            vendor/bin/phpcs --runtime-set ignore_warnings_on_exit 1
          else
            echo "No phpcs.xml in this repository; skipping PHPCS."
          fi

  security:
    name: Security (Snyk)
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: wakeforestuniversity/wfu-github/.github/actions/php-cache-restore@v1
        id: cache-composer
        with:
          php-version: ${{ inputs.phpVersion }}

      # Scans the repository's own Composer dependencies, and only those.
      #
      # `--all-projects` walks every manifest in the checkout, which on a
      # WordPress repository means far more than the application's
      # dependencies: `vendor/composer/composer/composer.lock` (Composer's own
      # bundled requirements, a build tool we neither ship nor execute in
      # production) and every `package.json` in the tree. In `app-web-aws-wp`
      # that is seven projects beyond the one anybody wants scanned, and the
      # npm ones have no `node_modules`, so Snyk reports "Please run 'npm
      # install' first" and exits non-zero on a dependency resolution failure
      # rather than on a vulnerability. The only vulnerable project it found
      # there was Composer's bundled lockfile.
      #
      # The result has been a job that fails on every pull request in every
      # consuming repository, for reasons unrelated to that repository's code.
      # A check that is always red reports nothing, and this one has been
      # ignored accordingly.
      #
      # `--file=composer.lock` scans the resolved dependency tree the
      # application actually installs, which is the thing a security gate is
      # for. The severity threshold is deliberately left at `low`: this change
      # narrows what is scanned, and does not relax what counts as a finding.
      #
      # Skips cleanly where a repository has no `composer.lock`, matching how
      # the PHPUnit and PHPCS steps guard themselves.
      - name: Run Snyk to check for vulnerabilities
        if: hashFiles('composer.lock') != ''
        uses: snyk/actions/php@master
        env:
          SNYK_TOKEN: ${{ secrets.securityToken }}
        with:
          args: --file=composer.lock --severity-threshold=low
