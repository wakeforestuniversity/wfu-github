name: Reusable Claude Review Workflow
#
# The org-wide Claude pull request reviewer. Consumer repositories keep only a
# stub whose `on:` block subscribes to pull_request events and whose single job
# `uses:` this workflow, so the action version, permissions, credential guard,
# prompt scaffolding, and posting tools live in exactly one place. The WP-8343
# cleanup shipped ten near-identical PRs across five repos to fix what this
# file now owns once; WP-8376 is the ticket that consolidated it.

on:
  workflow_call:
    inputs:
      reviewPrompt:
        description: >-
          Repository-specific review instructions. The REPO/PR context lines
          and the posting instructions are added around this automatically,
          so a custom prompt cannot accidentally lose the ability to post.
        required: false
        type: string
        default: |
          Please review this pull request and provide feedback on:
          - Code quality and best practices
          - Potential bugs or issues
          - Performance considerations
          - Security concerns
          - Test coverage

          Read the repository's CLAUDE.md first if one exists; it carries the
          repository's own rules. Be constructive and helpful in your feedback.
      allowedBots:
        description: >-
          Comma-separated bot logins whose pull requests should still be
          reviewed. The action refuses non-human actors by default, which
          otherwise leaves machine-opened PRs as the only unreviewed ones.
        required: false
        type: string
        default: ''
    secrets:
      claudeKey:
        required: true

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Verify the Claude credential is available
        env:
          KEY: ${{ secrets.claudeKey }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The Claude credential is empty in this repository."
            echo "The action treats a missing key as a no-op and reports success,"
            echo "so without this check a pull request would show a green review"
            echo "that never happened. Pass the organization secret"
            echo "UMC_CLAUDE_GITHUB_APP as claudeKey from the calling workflow."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.claudeKey }}
          allowed_bots: ${{ inputs.allowedBots }}
          # One review comment per PR, updated in place on later pushes, so a
          # PR that sees several pushes does not accumulate a stack of
          # near-identical reviews.
          use_sticky_comment: true
          # No model is pinned on purpose. `model` is not a v1 input; the
          # equivalent is `claude_args: --model`. v1 declares no default of
          # its own, so the value falls through to the Claude Code CLI's own
          # default, which we do not pin or observe.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ inputs.reviewPrompt }}

            Before writing anything, read the pull request's existing review
            discussion with `gh pr view` and `gh pr diff`. Do not re-raise
            points earlier review passes already made or that the author has
            already addressed; judge only what is new on the changed lines.

            If nothing new blocks the change, file a real approval with
            `gh pr review --approve` and a one-paragraph body saying what you
            verified. If something does block it, use `gh pr comment` for
            top-level feedback and `mcp__github_inline_comment__create_inline_comment`
            (with `confirmed: true`) to flag specific lines. Either way your
            conclusion must land on the pull request itself; review text left
            in the transcript reaches nobody. If the approval submission is
            refused, say so in a comment rather than failing silently.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*)"
